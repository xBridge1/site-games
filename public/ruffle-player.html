<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Flash</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #eee; font-family: sans-serif; }
    #player { width: 100%; height: 100%; }
    ruffle-player { display: block; width: 100%; height: 100%; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; pointer-events: none; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="status" role="status">Carregando jogo Flash...</div>
  <script>
    const status = document.getElementById('status');
    const source = new URLSearchParams(location.search).get('src');
    const gameUrl = source ? new URL(source, location.href) : null;
    if (!gameUrl || gameUrl.origin !== location.origin || !gameUrl.pathname.startsWith('/games/') || !gameUrl.pathname.endsWith('.swf')) {
      status.textContent = 'Endereço de jogo inválido.';
    } else {
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/@ruffle-rs/ruffle@0.6.0';
      script.onerror = () => { status.textContent = 'Não foi possível carregar o emulador. Feche o jogo e tente novamente.'; };
      script.onload = async () => {
        try {
          const player = window.RufflePlayer.newest().createPlayer();
          document.getElementById('player').appendChild(player);
          // Reduce rendering work for the Last Stand games without changing game speed.
          const isLastStand = /^\/games\/the-last-stand(?:-2|-union-city)?\/game\.swf$/.test(gameUrl.pathname);
          await player.ruffle().load({
            url: gameUrl.href,
            ...(isLastStand ? { quality: 'medium' } : {}),
          });
          status.hidden = true;
        } catch {
          status.textContent = 'Não foi possível carregar este jogo Flash.';
        }
      };
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
